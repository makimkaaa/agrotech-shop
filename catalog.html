<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Каталог AgroTech</h1>
    </header>

    <nav>
        <a href="index.html">Главная</a>
        <a href="about.html">О нас</a>
        <a href="catalog.html">Каталог</a>
        <a href="contact.html">Контакты</a>
    </nav>

    <section>

        <h2>Наши товары</h2>

        <div class="catalog">

            <div class="card">
                <h3>🚜 Трактор МТЗ</h3>
                <p>3 200 000 ₽</p>
                <button onclick="openOrder('Трактор МТЗ')">
                    Купить
                </button>
            </div>

            <div class="card">
                <h3>🚜 Мини-трактор</h3>
                <p>1 450 000 ₽</p>
                <button onclick="openOrder('Мини-трактор')">
                    Купить
                </button>
            </div>

            <div class="card">
                <h3>🌱 Азотные удобрения</h3>
                <p>15 000 ₽</p>
                <button onclick="openOrder('Азотные удобрения')">
                    Купить
                </button>
            </div>

        </div>

    </section>

    <div id="modal" class="modal">
        <div class="modal-content">

            <span class="close"
                  onclick="closeModal()">
                ×
            </span>

            <h2>Оформление заказа</h2>

            <p id="productName"></p>

            <input id="phone"
                   placeholder="Телефон">

            <input id="address"
                   placeholder="Адрес">

            <input id="house"
                   placeholder="Дом">

            <input id="entrance"
                   placeholder="Подъезд">

            <input id="floor"
                   placeholder="Этаж">

            <input id="flat"
                   placeholder="Квартира">

            <button onclick="sendOrder()">
                Подтвердить
            </button>

        </div>
    </div>

    <footer>
        © 2026 AgroTech
    </footer>

    <script src="script.js"></script>

</body>
</html>
